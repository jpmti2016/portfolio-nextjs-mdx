name: Sync Kiro Specs with GitHub Issues

# Thin caller — the actual logic is the reusable workflow in the
# source-of-truth repo (jpmti2016/projects-workflow-ai). Updates there take
# effect here automatically; this file should never need editing.

on:
  push:
    branches:
      - main
    paths:
      - ".kiro/specs/**"

jobs:
  sync:
    uses: jpmti2016/projects-workflow-ai/.github/workflows/sync-kiro-specs.yml@main
    permissions:
      issues: write
      contents: read
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
