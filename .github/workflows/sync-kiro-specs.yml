name: Sync Kiro Specs with GitHub Issues

# REUSABLE WORKFLOW (single source of truth).
# Consuming repos do NOT copy this file — they carry a ~10-line caller that
# does `uses: jpmti2016/projects-workflow-ai/.github/workflows/sync-kiro-specs.yml@main`
# (template: templates/caller-workflows/sync-kiro-specs.yml). Changes pushed
# to main here take effect in every consuming repo on its next run, with no
# propagation. The `github` context (repository, event.before, ref) inside a
# called workflow is the CALLER's, so all logic below works unchanged.

on:
  push:
    # staging only: it's the default/integration branch and the single source
    # of issue/Project status. Feature-branch spec pushes must not flip status,
    # and main (production) receives only promotion merges — issue status is
    # "done when integrated on staging", not "done when released to prod".
    branches:
      - staging
    paths:
      - ".kiro/specs/**"
  workflow_call:
    secrets:
      PROJECT_TOKEN:
        description: "Classic PAT (project scope) for ProjectV2 status writes"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    env:
      # Token split (least privilege):
      #   REPO_TOKEN    — the ephemeral, repo-scoped token GitHub injects into
      #                   every run. Used ONLY for the git clone and for closing
      #                   issues (issues: write on this repo). No setup needed.
      #   PROJECT_TOKEN — a long-lived credential with account-level Projects
      #                   access. Used ONLY for the ProjectV2 GraphQL read +
      #                   status mutations, which REPO_TOKEN cannot perform
      #                   because the project lives outside the repo boundary.
      #
      # PROJECT_TOKEN is REQUIRED. This workflow runs in "full status" mode:
      # it drives Todo → In Progress → Done on the Gantt. The In Progress
      # transition has no issue-level equivalent, so without PROJECT_TOKEN the
      # workflow cannot do its job and will FAIL with setup instructions rather
      # than silently degrade. Set it up with:
      #   ~/.kiro/scripts/setup-project-token.sh
      # (see PROJECT-WORKFLOW-GUIDE.md §6 for token creation + hardening).
      #
      # Required PROJECT_TOKEN: a CLASSIC PAT owned by jpmti2016 with the
      # "project" scope (Full control of projects) and a short expiry (e.g. 90
      # days). Project #2 is USER-owned, and fine-grained PATs do not expose a
      # "Projects" permission for user-owned ProjectsV2 — so a classic token is
      # required here.
      REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_ID: PVT_kwHOAVFSGM4BY7DU
      STATUS_FIELD_ID: PVTSSF_lAHOAVFSGM4BY7DUzhT9Y3I
      IN_PROGRESS_OPTION_ID: 47fc9ee4
      DONE_OPTION_ID: 98236657
      REPO: ${{ github.repository }}
      PROJECT_OWNER: jpmti2016
      # The commit the branch pointed at before this push (all-zeros for a new
      # branch). Used as the base of the full push-range diff below.
      EVENT_BEFORE: ${{ github.event.before }}

    steps:
      - name: Require PROJECT_TOKEN
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::PROJECT_TOKEN secret is not set. This workflow runs in" \
              "full status mode (Todo → In Progress → Done) and needs a token with" \
              "account-level Projects access."
            echo "::error::Fix: create a CLASSIC PAT with the \"project\" scope" \
              "(Full control of projects), then store it as a repo secret named" \
              "PROJECT_TOKEN. Run ~/.kiro/scripts/setup-project-token.sh locally," \
              "or see PROJECT-WORKFLOW-GUIDE.md §6."
            exit 1
          fi
          echo "PROJECT_TOKEN is present — full status automation enabled."

      - name: Refuse a broad token in a public repo
        # A public repo runs this workflow on events anyone can cause, so its
        # PROJECT_TOKEN must be the NARROW classic PAT (scope "project" only).
        # The broad one ("repo") reaches every private repo; if a public repo
        # holds it (e.g. it was just made public), fail closed here, before
        # the token is used for anything. secure-public-repos.yml in
        # projects-workflow-ai swaps in the narrow token daily; to fix it now
        # run: ~/.kiro/scripts/setup-project-token.sh --public-token <token>
        env:
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_IS_PRIVATE" = "true" ]; then
            exit 0
          fi
          SCOPES=$(GH_TOKEN="$PROJECT_TOKEN" gh api -i /user 2>/dev/null | tr -d '\r' \
            | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p' | head -1)
          for SCOPE in $(printf '%s' "$SCOPES" | tr ',' ' '); do
            case "$SCOPE" in
              project|read:project|read:org|read:user) ;;
              *)
                echo "::error::This repo is public but PROJECT_TOKEN has the \"$SCOPE\" scope (only \"project\" is allowed here;" \
                  "the broad token reaches private repos). Store the project-only token:" \
                  "~/.kiro/scripts/setup-project-token.sh --public-token <token> (PROJECT-WORKFLOW-GUIDE.md §6)."
                exit 1
                ;;
            esac
          done
          echo "Public repo: PROJECT_TOKEN is narrow (${SCOPES:-fine-grained})."
      - name: Checkout (manual — no external action required)
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          # A plain clone avoids actions/checkout, which the account/org Actions
          # policy blocks when set to "Allow <owner> actions and reusable
          # workflows" ("all actions must be from a repository owned by
          # jpmti2016"). Full history (no --depth) so the whole push range
          # github.event.before..GITHUB_SHA can be diffed, even when a push
          # contains more than one commit.
          git clone --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Process changed specs
        run: |
          # Diff the WHOLE push range (before..after), not just the last commit,
          # so a spec is detected even when it is not the final commit of a push.
          AFTER="$GITHUB_SHA"
          ZERO="0000000000000000000000000000000000000000"
          # Fall back to the empty tree when the before-commit is absent (new
          # branch, or first-ever push) so the diff still lists files.
          if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "$ZERO" ] \
             || ! git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null; then
            BASE=$(git hash-object -t tree /dev/null)
          else
            BASE="$EVENT_BEFORE"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$AFTER" | grep '^\.kiro/specs/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No spec files changed."
            exit 0
          fi

          # Collect unique spec folders
          SPEC_FOLDERS=$(echo "$CHANGED" | awk -F'/' '{print $3}' | sort -u)

          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"

          # A tasks.md can carry work for MORE THAN ONE issue. The folder's own
          # issue (the number prefix) owns every task before the first
          # "## Issue #N" heading; each such heading opens the task section of
          # a later issue that AMENDS this spec instead of getting a competing
          # spec folder of its own (see PROJECT-WORKFLOW-GUIDE.md §9, "Amending
          # an existing spec"). This prints only the checkbox lines of ONE
          # issue's section, so status is driven per issue and unrelated
          # edits to the file never look like task changes.
          #   usage: section_tasks <tasks.md content> <issue> <folder issue>
          section_tasks() {
            printf '%s\n' "$1" | awk -v want="$2" -v own="$3" '
              BEGIN { cur = own }
              /^## Issue #[0-9]+/ { cur = $0; sub(/^## Issue #/, "", cur); sub(/[^0-9].*$/, "", cur); next }
              /^[[:space:]]*- \[(x| )\]/ { if (cur == want) print }
            '
          }

          for FOLDER in $SPEC_FOLDERS; do
            # Extract issue number from folder name (e.g. 42-feature-name → 42)
            FOLDER_ISSUE=$(echo "$FOLDER" | grep -oE '^[0-9]+' || true)

            if [ -z "$FOLDER_ISSUE" ]; then
              echo "Skipping $FOLDER — no issue number prefix."
              continue
            fi

            TASKS_FILE=".kiro/specs/$FOLDER/tasks.md"

            # tasks.md before and after this push. Absent before (new spec, or
            # the empty-tree fallback) reads as empty, so every task is new.
            OLD_CONTENT=$(git show "$BASE:$TASKS_FILE" 2>/dev/null || true)
            NEW_CONTENT=$(git show "$AFTER:$TASKS_FILE" 2>/dev/null || true)

            if [ -z "$NEW_CONTENT" ]; then
              echo "No tasks.md found for $FOLDER, skipping."
              continue
            fi

            # Every issue this tasks.md tracks: the folder's own, plus each
            # "## Issue #N" amendment heading.
            AMENDMENTS=$(printf '%s\n' "$NEW_CONTENT" | grep -oE '^## Issue #[0-9]+' | grep -oE '[0-9]+' || true)
            ISSUES=$(printf '%s\n' "$FOLDER_ISSUE" "$AMENDMENTS" | grep -E '^[0-9]+$' | sort -un)

            for ISSUE_NUMBER in $ISSUES; do
              OLD_TASKS=$(section_tasks "$OLD_CONTENT" "$ISSUE_NUMBER" "$FOLDER_ISSUE")
              NEW_TASKS=$(section_tasks "$NEW_CONTENT" "$ISSUE_NUMBER" "$FOLDER_ISSUE")

              if [ "$OLD_TASKS" = "$NEW_TASKS" ]; then
                echo "Issue #$ISSUE_NUMBER ($FOLDER) — tasks unchanged in this push, skipping."
                continue
              fi

              # New for this issue when it had no tasks before the push: a new
              # spec, or a new amendment section in an existing one.
              if [ -z "$OLD_TASKS" ]; then IS_NEW=1; else IS_NEW=0; fi

              # Count total and completed tasks in this issue's section
              TOTAL=$(printf '%s\n' "$NEW_TASKS" | grep -cE '^\s*- \[(x| )\]' || true)
              COMPLETED=$(printf '%s\n' "$NEW_TASKS" | grep -cE '^\s*- \[x\]' || true)

              echo "Issue #$ISSUE_NUMBER ($FOLDER) — tasks: $COMPLETED/$TOTAL, new: $IS_NEW"

              # Look up this issue's item in Project #2 FROM THE ISSUE SIDE: an
              # issue knows the project items that reference it, so one small
              # query answers the question regardless of how big the project
              # grows. Never scan the project's item list for it — items(first:
              # 100) only ever returns the FIRST PAGE, and Project #2 aggregates
              # issues from every repo, so once it passed 100 items every new
              # issue landed beyond that page and came back "not found" even
              # though add-issue-to-project.yml had added it. That silently
              # killed all status updates in Sep 2026 (regression test:
              # .kiro/scripts/test-sync-kiro-specs.sh). Reading the issue's
              # projectItems needs project access (PROJECT_TOKEN) and, for a
              # private repo, repo scope — the same access
              # add-issue-to-project.yml already relies on.
              ITEM_ID=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
                -f query='query($owner:String!,$name:String!,$num:Int!){ repository(owner:$owner,name:$name){ issue(number:$num){ projectItems(first:20){ nodes{ id project{ id } } } } } }' \
                -f owner="$OWNER" -f name="$NAME" -F num="$ISSUE_NUMBER" \
                --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" || true)

              if [ -z "$ITEM_ID" ]; then
                echo "::warning::Issue #$ISSUE_NUMBER not found in project — add it to" \
                  "Project #2 so its status can be tracked. Skipping status update."
                # Still close the issue if all tasks are done.
                if [ "$TOTAL" -gt 0 ] && [ "$TOTAL" -eq "$COMPLETED" ]; then
                  GH_TOKEN="$REPO_TOKEN" gh issue close "$ISSUE_NUMBER" -R "$REPO"
                fi
                continue
              fi

              if [ "$TOTAL" -gt 0 ] && [ "$TOTAL" -eq "$COMPLETED" ]; then
                # All tasks done → set status to Done and close issue.
                echo "All tasks complete — marking Done and closing issue #$ISSUE_NUMBER"
                GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query="
                  mutation {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: \"$PROJECT_ID\"
                      itemId: \"$ITEM_ID\"
                      fieldId: \"$STATUS_FIELD_ID\"
                      value: { singleSelectOptionId: \"$DONE_OPTION_ID\" }
                    }) { projectV2Item { id } }
                  }
                "
                GH_TOKEN="$REPO_TOKEN" gh issue close "$ISSUE_NUMBER" -R "$REPO"

              elif [ "$IS_NEW" -eq 1 ] && [ "$TOTAL" -gt 0 ]; then
                # New tasks for this issue → set status to In Progress. This
                # transition has no issue-level equivalent, which is why
                # PROJECT_TOKEN is required.
                echo "New tasks — marking In Progress for issue #$ISSUE_NUMBER"
                GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query="
                  mutation {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: \"$PROJECT_ID\"
                      itemId: \"$ITEM_ID\"
                      fieldId: \"$STATUS_FIELD_ID\"
                      value: { singleSelectOptionId: \"$IN_PROGRESS_OPTION_ID\" }
                    }) { projectV2Item { id } }
                  }
                "
              fi
            done
          done
