name: Add New Issues to Project

# Thin caller — the actual logic is the reusable workflow in the
# source-of-truth repo (jpmti2016/projects-workflow-ai). Updates there take
# effect here automatically; this file should never need editing.

on:
  issues:
    types: [opened, reopened, transferred]

jobs:
  add-to-project:
    uses: jpmti2016/projects-workflow-ai/.github/workflows/add-issue-to-project.yml@main
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
