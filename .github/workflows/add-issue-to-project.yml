name: Add New Issues to Project

# Auto-adds every newly created issue in this repo to GitHub Project #2, so the
# spec-sync automation always has a project item to update (Todo → In Progress
# → Done). Runs server-side, so it covers issues created any way: the
# /problem-to-issues skill, gh CLI, or the GitHub UI.
#
# Adding an issue that is already in the project is a no-op (the mutation
# returns the existing item), so reopened/transferred issues are safe.

# REUSABLE WORKFLOW (single source of truth).
# Consuming repos carry only a thin caller
# (template: templates/caller-workflows/add-issue-to-project.yml); the
# `github.event.issue` context inside a called workflow is the caller's event.

on:
  issues:
    types: [opened, reopened, transferred]
  workflow_call:
    secrets:
      PROJECT_TOKEN:
        description: "Classic PAT (project scope) for ProjectV2 item adds"
        required: true

jobs:
  add-to-project:
    runs-on: ubuntu-latest

    env:
      # Adding an item to a user-owned ProjectV2 needs account-level Projects
      # access — the built-in GITHUB_TOKEN cannot do it. Reuses the same
      # PROJECT_TOKEN as sync-kiro-specs.yml. See PROJECT-WORKFLOW-GUIDE.md §6.
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_ID: PVT_kwHOAVFSGM4BY7DU
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Require PROJECT_TOKEN
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::PROJECT_TOKEN secret is not set. Issues cannot be" \
              "auto-added to Project #2 without account-level Projects access."
            echo "::error::Fix: run ~/.kiro/scripts/setup-project-token.sh locally," \
              "or see PROJECT-WORKFLOW-GUIDE.md §6."
            exit 1
          fi

      - name: Refuse a broad token in a public repo
        # A public repo runs this workflow on events anyone can cause, so its
        # PROJECT_TOKEN must be the NARROW classic PAT (scope "project" only).
        # The broad one ("repo") reaches every private repo; if a public repo
        # holds it (e.g. it was just made public), fail closed here, before
        # the token is used for anything. secure-public-repos.yml in
        # projects-workflow-ai swaps in the narrow token daily; to fix it now
        # run: ~/.kiro/scripts/setup-project-token.sh --public-token <token>
        env:
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_IS_PRIVATE" = "true" ]; then
            exit 0
          fi
          SCOPES=$(GH_TOKEN="$PROJECT_TOKEN" gh api -i /user 2>/dev/null | tr -d '\r' \
            | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p' | head -1)
          for SCOPE in $(printf '%s' "$SCOPES" | tr ',' ' '); do
            case "$SCOPE" in
              project|read:project|read:org|read:user) ;;
              *)
                echo "::error::This repo is public but PROJECT_TOKEN has the \"$SCOPE\" scope (only \"project\" is allowed here;" \
                  "the broad token reaches private repos). Store the project-only token:" \
                  "~/.kiro/scripts/setup-project-token.sh --public-token <token> (PROJECT-WORKFLOW-GUIDE.md §6)."
                exit 1
                ;;
            esac
          done
          echo "Public repo: PROJECT_TOKEN is narrow (${SCOPES:-fine-grained})."
      - name: Add issue to Project #2
        env:
          GH_TOKEN: ${{ env.PROJECT_TOKEN }}
        run: |
          echo "Adding issue #${ISSUE_NUMBER} to project ${PROJECT_ID}..."
          ITEM_ID=$(gh api graphql \
            -f query='mutation($pid:ID!,$cid:ID!){ addProjectV2ItemById(input:{projectId:$pid contentId:$cid}){ item { id } } }' \
            -f pid="$PROJECT_ID" \
            -f cid="$ISSUE_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "✓ Issue #${ISSUE_NUMBER} is in the project (item: ${ITEM_ID})."
